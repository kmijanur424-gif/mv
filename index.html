<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AetherPlayer — Modern Glassmorphism Video Player</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-black text-slate-100 w-screen h-[100dvh] m-0 p-0 overflow-hidden select-none selection:bg-indigo-500 selection:text-white">

    <!-- Full-Viewport Video Player Container -->
    <main 
        id="playerContainer" 
        tabindex="0"
        class="relative w-screen h-[100dvh] bg-black overflow-hidden group outline-none"
    >
        <!-- HTML5 Video Element -->
        <video 
            id="videoElement" 
            class="w-full h-full object-contain bg-black"
            src="https://cdn.freevidco.com/Sex%20Game%206969.mp4"
            playsinline
            preload="auto"
        ></video>

        <!-- Interactive Gesture Layer (Single tap play/pause, Double tap/click left/right ±10s, Center double-click fullscreen) -->
        <div id="gestureLayer" class="absolute inset-0 z-10 flex">
            <!-- Left Zone (-10s on double tap/click) -->
            <div id="leftZone" class="w-1/3 h-full flex items-center justify-center cursor-pointer relative">
                <div id="leftSkipRipple" class="opacity-0 scale-75 pointer-events-none flex flex-col items-center justify-center w-20 h-20 sm:w-24 sm:h-24 rounded-full bg-white/10 backdrop-blur-md border border-white/15 text-white transition-all duration-200">
                    <i data-lucide="rewind" class="w-6 h-6 sm:w-7 sm:h-7 fill-white"></i>
                    <span class="text-xs font-semibold mt-1">-10s</span>
                </div>
            </div>

            <!-- Center Zone (Play/Pause on tap, Fullscreen on desktop double-click) -->
            <div id="centerZone" class="w-1/3 h-full flex items-center justify-center cursor-pointer relative">
                <!-- Initial / Paused Center Play Button -->
                <button 
                    id="centerPlayBtn" 
                    aria-label="Play or Pause Video"
                    class="w-16 h-16 sm:w-20 sm:h-20 rounded-full bg-slate-900/65 hover:bg-indigo-600/90 backdrop-blur-xl border border-white/20 flex items-center justify-center text-white shadow-[0_0_45px_rgba(99,102,241,0.45)] hover:scale-105 active:scale-95 transition-all duration-200 cursor-pointer"
                >
                    <i data-lucide="play" class="w-7 h-7 sm:w-8 sm:h-8 fill-white ml-1"></i>
                </button>

                <!-- Animated Tap Play/Pause Feedback Pulse -->
                <div id="centerPulseBadge" class="absolute pointer-events-none opacity-0 scale-75 w-16 h-16 sm:w-20 sm:h-20 rounded-full bg-slate-900/75 backdrop-blur-xl border border-white/20 flex items-center justify-center text-white shadow-2xl transition-all duration-200">
                    <i id="centerPulseIcon" data-lucide="play" class="w-7 h-7 sm:w-8 sm:h-8 fill-white"></i>
                </div>
            </div>

            <!-- Right Zone (+10s on double tap/click) -->
            <div id="rightZone" class="w-1/3 h-full flex items-center justify-center cursor-pointer relative">
                <div id="rightSkipRipple" class="opacity-0 scale-75 pointer-events-none flex flex-col items-center justify-center w-20 h-20 sm:w-24 sm:h-24 rounded-full bg-white/10 backdrop-blur-md border border-white/15 text-white transition-all duration-200">
                    <i data-lucide="fast-forward" class="w-6 h-6 sm:w-7 sm:h-7 fill-white"></i>
                    <span class="text-xs font-semibold mt-1">+10s</span>
                </div>
            </div>
        </div>

        <!-- Loading Spinner Overlay -->
        <div id="loadingSpinner" class="absolute inset-0 flex items-center justify-center bg-black/35 backdrop-blur-[2px] pointer-events-none opacity-0 transition-opacity duration-200 z-20">
            <div class="w-12 h-12 sm:w-14 sm:h-14 rounded-full border-4 border-white/15 border-t-indigo-500 animate-spin shadow-lg"></div>
        </div>

        <!-- Clean Error Fallback Overlay (Replaces alert()) -->
        <div id="errorOverlay" class="hidden absolute inset-0 z-40 bg-black/85 backdrop-blur-xl flex flex-col items-center justify-center p-6 text-center">
            <div class="w-14 h-14 rounded-2xl bg-rose-500/15 border border-rose-500/30 flex items-center justify-center text-rose-400 mb-4 shadow-lg">
                <i data-lucide="wifi-off" class="w-7 h-7"></i>
            </div>
            <h2 class="text-base sm:text-lg font-semibold text-white mb-1.5">Stream Unavailable</h2>
            <p id="errorMessage" class="text-xs sm:text-sm text-slate-400 max-w-md mb-5">Unable to load the video stream. The server may be unreachable or blocked by browser restrictions.</p>
            <button 
                id="retryBtn" 
                class="bg-indigo-600 hover:bg-indigo-500 active:scale-95 text-white text-xs sm:text-sm font-medium px-5 py-2.5 rounded-xl shadow-lg shadow-indigo-600/25 transition-all flex items-center gap-2 cursor-pointer"
            >
                <i data-lucide="refresh-cw" class="w-4 h-4"></i>
                <span>Retry Stream</span>
            </button>
        </div>

        <!-- Floating Status Toast Badge (Volume %, Speed, Shortcuts) -->
        <div id="actionBadge" class="absolute top-5 right-5 sm:top-7 sm:right-7 bg-slate-900/80 backdrop-blur-xl border border-white/15 text-white px-3.5 py-1.5 rounded-full text-xs sm:text-sm font-medium flex items-center gap-2 opacity-0 scale-95 pointer-events-none transition-all duration-200 z-30 shadow-2xl">
            <span id="actionBadgeText">100%</span>
        </div>

        <!-- Bottom Floating Dark Glassmorphism Control Overlay -->
        <div 
            id="controlsOverlay" 
            class="absolute inset-x-0 bottom-0 pt-20 pb-3 px-3 sm:px-6 sm:pb-6 bg-gradient-to-t from-black/90 via-black/40 to-transparent transition-all duration-300 z-30 flex flex-col items-center"
        >
            <div class="w-full max-w-6xl flex flex-col gap-2 sm:gap-2.5">
                
                <!-- Interactive Timeline Scrubber -->
                <div id="progressContainer" class="relative w-full h-5 flex items-center cursor-pointer group/progress touch-none">
                    <!-- Hover Timestamp Tooltip -->
                    <div 
                        id="hoverTooltip" 
                        class="absolute -top-8 -translate-x-1/2 bg-slate-900/95 backdrop-blur-md border border-white/15 text-white text-[11px] font-medium px-2.5 py-0.5 rounded-lg pointer-events-none opacity-0 transition-opacity duration-150 shadow-xl whitespace-nowrap tabular-nums"
                    >
                        00:00
                    </div>

                    <!-- Track Background -->
                    <div class="relative w-full h-1.5 group-hover/progress:h-2.5 bg-white/20 rounded-full overflow-hidden transition-all duration-150">
                        <!-- Buffered Progress Bar -->
                        <div id="bufferedBar" class="absolute top-0 left-0 h-full bg-white/30 rounded-full w-0 transition-all duration-200"></div>
                        <!-- Glowing Accent Fill Bar -->
                        <div id="progressBar" class="absolute top-0 left-0 h-full bg-gradient-to-r from-indigo-500 via-purple-500 to-pink-500 shadow-[0_0_12px_rgba(139,92,246,0.85)] rounded-full w-0"></div>
                    </div>

                    <!-- Draggable Scrubber Thumb -->
                    <div 
                        id="progressThumb" 
                        class="absolute left-0 -translate-x-1/2 w-3.5 h-3.5 sm:w-4 sm:h-4 bg-white rounded-full shadow-[0_0_14px_rgba(255,255,255,0.95)] scale-0 group-hover/progress:scale-100 transition-transform duration-150 pointer-events-none"
                    ></div>
                </div>

                <!-- Floating Glassmorphism Control Pill -->
                <div class="w-full bg-slate-950/65 backdrop-blur-2xl border border-white/12 rounded-2xl px-2.5 py-1.5 sm:px-4 sm:py-2.5 flex items-center justify-between gap-2 shadow-[0_12px_40px_rgba(0,0,0,0.75)]">
                    
                    <!-- Left Controls: Play/Pause, -10s / +10s, Volume, Time -->
                    <div class="flex items-center gap-1 sm:gap-2">
                        <!-- Play/Pause Button -->
                        <button id="playPauseBtn" title="Play/Pause (Space / K)" class="p-2 rounded-xl text-slate-200 hover:text-white hover:bg-white/10 active:scale-95 transition-all cursor-pointer">
                            <i data-lucide="play" class="w-5 h-5 fill-current"></i>
                        </button>

                        <!-- Skip -10s -->
                        <button id="rewindBtn" title="Rewind 10s" class="p-2 rounded-xl text-slate-300 hover:text-white hover:bg-white/10 active:scale-95 transition-all cursor-pointer flex items-center gap-0.5">
                            <i data-lucide="rotate-ccw" class="w-4 h-4 sm:w-[18px] sm:h-[18px]"></i>
                            <span class="hidden lg:inline text-[11px] font-medium">10s</span>
                        </button>

                        <!-- Skip +10s -->
                        <button id="forwardBtn" title="Forward 10s" class="p-2 rounded-xl text-slate-300 hover:text-white hover:bg-white/10 active:scale-95 transition-all cursor-pointer flex items-center gap-0.5">
                            <i data-lucide="rotate-cw" class="w-4 h-4 sm:w-[18px] sm:h-[18px]"></i>
                            <span class="hidden lg:inline text-[11px] font-medium">10s</span>
                        </button>

                        <!-- Mute & Expandable Horizontal Volume Slider -->
                        <div class="flex items-center gap-1 group/vol">
                            <button id="muteBtn" title="Mute/Unmute (M)" class="p-2 rounded-xl text-slate-200 hover:text-white hover:bg-white/10 active:scale-95 transition-all cursor-pointer">
                                <i data-lucide="volume-2" class="w-5 h-5"></i>
                            </button>
                            <div class="w-0 overflow-hidden group-hover/vol:w-16 sm:group-hover/vol:w-24 focus-within:w-20 transition-all duration-200 flex items-center">
                                <input 
                                    type="range" 
                                    id="volumeSlider" 
                                    min="0" 
                                    max="1" 
                                    step="0.02" 
                                    value="1" 
                                    aria-label="Volume"
                                    class="w-full h-1.5 bg-white/25 rounded-lg appearance-none cursor-pointer accent-indigo-500"
                                >
                            </div>
                        </div>

                        <!-- Current / Total Time Display -->
                        <div class="text-xs sm:text-sm font-medium text-slate-400 tabular-nums pl-1 sm:pl-2">
                            <span id="currentTimeDisplay" class="text-white">00:00</span>
                            <span class="mx-1 text-slate-600">/</span>
                            <span id="durationDisplay">00:00</span>
                        </div>
                    </div>

                    <!-- Right Controls: Playback Speed, PiP, Fullscreen -->
                    <div class="flex items-center gap-1 sm:gap-2">
                        <!-- Playback Speed Selector -->
                        <div class="relative">
                            <button 
                                id="speedBtn" 
                                title="Playback Speed"
                                class="px-2.5 py-1.5 rounded-xl text-xs font-semibold text-slate-200 hover:text-white bg-white/5 hover:bg-white/15 border border-white/10 active:scale-95 transition-all cursor-pointer tabular-nums"
                            >
                                1x
                            </button>
                            <!-- Speed Dropdown Menu -->
                            <div 
                                id="speedMenu" 
                                class="hidden absolute bottom-full right-0 mb-2.5 w-24 bg-slate-900/95 backdrop-blur-2xl border border-white/15 rounded-xl p-1 shadow-2xl flex-col gap-0.5 z-50"
                            >
                                <button data-speed="0.5" class="speed-option w-full text-left px-3 py-1.5 text-xs rounded-lg text-slate-300 hover:bg-white/10 hover:text-white transition-colors cursor-pointer">0.5x</button>
                                <button data-speed="1" class="speed-option w-full text-left px-3 py-1.5 text-xs rounded-lg bg-indigo-600/35 text-indigo-300 font-semibold transition-colors cursor-pointer">1x</button>
                                <button data-speed="1.25" class="speed-option w-full text-left px-3 py-1.5 text-xs rounded-lg text-slate-300 hover:bg-white/10 hover:text-white transition-colors cursor-pointer">1.25x</button>
                                <button data-speed="1.5" class="speed-option w-full text-left px-3 py-1.5 text-xs rounded-lg text-slate-300 hover:bg-white/10 hover:text-white transition-colors cursor-pointer">1.5x</button>
                                <button data-speed="2" class="speed-option w-full text-left px-3 py-1.5 text-xs rounded-lg text-slate-300 hover:bg-white/10 hover:text-white transition-colors cursor-pointer">2x</button>
                            </div>
                        </div>

                        <!-- Picture-in-Picture Toggle -->
                        <button id="pipBtn" title="Picture-in-Picture" class="p-2 rounded-xl text-slate-200 hover:text-white hover:bg-white/10 active:scale-95 transition-all cursor-pointer">
                            <i data-lucide="picture-in-picture-2" class="w-4 h-4 sm:w-5 sm:h-5"></i>
                        </button>

                        <!-- Fullscreen Toggle -->
                        <button id="fullscreenBtn" title="Fullscreen (F)" class="p-2 rounded-xl text-slate-200 hover:text-white hover:bg-white/10 active:scale-95 transition-all cursor-pointer">
                            <i data-lucide="maximize" class="w-4 h-4 sm:w-5 sm:h-5"></i>
                        </button>
                    </div>

                </div>
            </div>
        </div>

    </main>

    <script>
        /**
         * Full-Page Responsive HTML5 Glassmorphism Video Player
         */
        document.addEventListener('DOMContentLoaded', () => {
            lucide.createIcons();

            // Core Elements
            const playerContainer = document.getElementById('playerContainer');
            const video = document.getElementById('videoElement');
            const controlsOverlay = document.getElementById('controlsOverlay');
            const loadingSpinner = document.getElementById('loadingSpinner');

            // Gesture & Center Feedback Elements
            const leftZone = document.getElementById('leftZone');
            const centerZone = document.getElementById('centerZone');
            const rightZone = document.getElementById('rightZone');
            const leftSkipRipple = document.getElementById('leftSkipRipple');
            const rightSkipRipple = document.getElementById('rightSkipRipple');
            const centerPlayBtn = document.getElementById('centerPlayBtn');
            const centerPulseBadge = document.getElementById('centerPulseBadge');
            const actionBadge = document.getElementById('actionBadge');
            const actionBadgeText = document.getElementById('actionBadgeText');

            // Error Fallback Elements
            const errorOverlay = document.getElementById('errorOverlay');
            const errorMessage = document.getElementById('errorMessage');
            const retryBtn = document.getElementById('retryBtn');

            // Timeline Elements
            const progressContainer = document.getElementById('progressContainer');
            const bufferedBar = document.getElementById('bufferedBar');
            const progressBar = document.getElementById('progressBar');
            const progressThumb = document.getElementById('progressThumb');
            const hoverTooltip = document.getElementById('hoverTooltip');

            // Control Buttons & Displays
            const playPauseBtn = document.getElementById('playPauseBtn');
            const rewindBtn = document.getElementById('rewindBtn');
            const forwardBtn = document.getElementById('forwardBtn');
            const muteBtn = document.getElementById('muteBtn');
            const volumeSlider = document.getElementById('volumeSlider');
            const currentTimeDisplay = document.getElementById('currentTimeDisplay');
            const durationDisplay = document.getElementById('durationDisplay');
            const speedBtn = document.getElementById('speedBtn');
            const speedMenu = document.getElementById('speedMenu');
            const speedOptions = document.querySelectorAll('.speed-option');
            const pipBtn = document.getElementById('pipBtn');
            const fullscreenBtn = document.getElementById('fullscreenBtn');

            // Player State
            let isDraggingProgress = false;
            let hideControlsTimeout = null;
            let badgeTimeout = null;
            let pulseTimeout = null;
            let leftRippleTimeout = null;
            let rightRippleTimeout = null;
            let lastVolume = 1;

            // Touch / Click Gesture Timers
            let lastTapTime = 0;
            let singleTapTimer = null;

            function formatTime(seconds) {
                if (isNaN(seconds) || !isFinite(seconds) || seconds < 0) return '00:00';
                const hrs = Math.floor(seconds / 3600);
                const mins = Math.floor((seconds % 3600) / 60);
                const secs = Math.floor(seconds % 60);
                if (hrs > 0) {
                    return `${hrs}:${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
                }
                return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
            }

            function showActionBadge(text) {
                actionBadgeText.textContent = text;
                actionBadge.classList.remove('opacity-0', 'scale-95');
                actionBadge.classList.add('opacity-100', 'scale-100');
                clearTimeout(badgeTimeout);
                badgeTimeout = setTimeout(() => {
                    actionBadge.classList.remove('opacity-100', 'scale-100');
                    actionBadge.classList.add('opacity-0', 'scale-95');
                }, 900);
            }

            function triggerCenterPulse(isNowPlaying) {
                const iconName = isNowPlaying ? 'play' : 'pause';
                centerPulseBadge.innerHTML = `<i data-lucide="${iconName}" class="w-7 h-7 sm:w-8 sm:h-8 fill-white ${isNowPlaying ? 'ml-1' : ''}"></i>`;
                lucide.createIcons();

                centerPulseBadge.classList.remove('opacity-0', 'scale-75');
                centerPulseBadge.classList.add('opacity-100', 'scale-100');
                clearTimeout(pulseTimeout);
                pulseTimeout = setTimeout(() => {
                    centerPulseBadge.classList.remove('opacity-100', 'scale-100');
                    centerPulseBadge.classList.add('opacity-0', 'scale-110');
                    setTimeout(() => {
                        centerPulseBadge.classList.remove('scale-110');
                        centerPulseBadge.classList.add('scale-75');
                    }, 180);
                }, 420);
            }

            function triggerSkipRipple(direction) {
                const el = direction === 'left' ? leftSkipRipple : rightSkipRipple;
                el.classList.remove('opacity-0', 'scale-75');
                el.classList.add('opacity-100', 'scale-100');

                if (direction === 'left') {
                    clearTimeout(leftRippleTimeout);
                    leftRippleTimeout = setTimeout(() => {
                        el.classList.remove('opacity-100', 'scale-100');
                        el.classList.add('opacity-0', 'scale-75');
                    }, 550);
                } else {
                    clearTimeout(rightRippleTimeout);
                    rightRippleTimeout = setTimeout(() => {
                        el.classList.remove('opacity-100', 'scale-100');
                        el.classList.add('opacity-0', 'scale-75');
                    }, 550);
                }
            }

            function updatePlayPauseUI() {
                const isPaused = video.paused || video.ended;
                const iconName = isPaused ? 'play' : 'pause';

                playPauseBtn.innerHTML = `<i data-lucide="${iconName}" class="w-5 h-5 fill-current"></i>`;
                centerPlayBtn.innerHTML = `<i data-lucide="${iconName}" class="w-7 h-7 sm:w-8 sm:h-8 fill-white ${isPaused ? 'ml-1' : ''}"></i>`;
                lucide.createIcons();

                if (isPaused) {
                    centerPlayBtn.classList.remove('opacity-0', 'scale-90', 'pointer-events-none');
                    showControls();
                } else {
                    centerPlayBtn.classList.add('opacity-0', 'scale-90', 'pointer-events-none');
                    scheduleHideControls();
                }
            }

            async function togglePlay(withPulse = false) {
                try {
                    if (video.paused || video.ended) {
                        await video.play();
                        if (withPulse) triggerCenterPulse(true);
                    } else {
                        video.pause();
                        if (withPulse) triggerCenterPulse(false);
                    }
                } catch (err) {
                    console.error('Playback error:', err);
                }
            }

            function seekBy(seconds, showBadge = true) {
                if (!video.duration) return;
                video.currentTime = Math.min(Math.max(0, video.currentTime + seconds), video.duration);
                if (showBadge) {
                    showActionBadge(seconds > 0 ? `+${seconds}s` : `${seconds}s`);
                }
            }

            function updateVolumeUI() {
                const vol = video.muted ? 0 : video.volume;
                volumeSlider.value = vol;
                let iconName = 'volume-2';
                if (vol === 0) iconName = 'volume-x';
                else if (vol < 0.5) iconName = 'volume-1';

                muteBtn.innerHTML = `<i data-lucide="${iconName}" class="w-5 h-5"></i>`;
                lucide.createIcons();
            }

            function setVolume(newVol) {
                const clamped = Math.min(Math.max(0, newVol), 1);
                video.volume = clamped;
                video.muted = clamped === 0;
                if (clamped > 0) lastVolume = clamped;
                updateVolumeUI();
                showActionBadge(`Volume ${Math.round(clamped * 100)}%`);
            }

            function toggleMute() {
                if (video.muted || video.volume === 0) {
                    video.muted = false;
                    video.volume = lastVolume > 0 ? lastVolume : 0.5;
                } else {
                    lastVolume = video.volume;
                    video.muted = true;
                }
                updateVolumeUI();
                showActionBadge(video.muted ? 'Muted' : `Volume ${Math.round(video.volume * 100)}%`);
            }

            function updateProgress() {
                if (!video.duration || isDraggingProgress) return;
                const percent = (video.currentTime / video.duration) * 100;
                progressBar.style.width = `${percent}%`;
                progressThumb.style.left = `${percent}%`;
                currentTimeDisplay.textContent = formatTime(video.currentTime);
            }

            function updateBuffer() {
                if (!video.duration || video.buffered.length === 0) return;
                try {
                    const bufferedEnd = video.buffered.end(video.buffered.length - 1);
                    const percent = Math.min((bufferedEnd / video.duration) * 100, 100);
                    bufferedBar.style.width = `${percent}%`;
                } catch (e) {}
            }

            function scrubToEvent(clientX) {
                const rect = progressContainer.getBoundingClientRect();
                const pos = Math.min(Math.max(0, clientX - rect.left), rect.width);
                const ratio = pos / rect.width;
                const percent = ratio * 100;

                progressBar.style.width = `${percent}%`;
                progressThumb.style.left = `${percent}%`;

                if (video.duration) {
                    const targetTime = ratio * video.duration;
                    currentTimeDisplay.textContent = formatTime(targetTime);
                    return targetTime;
                }
                return 0;
            }

            function showControls() {
                controlsOverlay.classList.remove('opacity-0', 'translate-y-2', 'pointer-events-none');
                playerContainer.classList.remove('cursor-none');
                scheduleHideControls();
            }

            function scheduleHideControls() {
                clearTimeout(hideControlsTimeout);
                if (!video.paused && !video.ended && !isDraggingProgress && speedMenu.classList.contains('hidden')) {
                    hideControlsTimeout = setTimeout(() => {
                        controlsOverlay.classList.add('opacity-0', 'translate-y-2', 'pointer-events-none');
                        playerContainer.classList.add('cursor-none');
                    }, 2500);
                }
            }

            async function toggleFullscreen() {
                try {
                    if (!document.fullscreenElement) {
                        await playerContainer.requestFullscreen();
                    } else {
                        await document.exitFullscreen();
                    }
                } catch (err) {
                    showActionBadge('Fullscreen Blocked');
                }
            }

            document.addEventListener('fullscreenchange', () => {
                const isFs = !!document.fullscreenElement;
                fullscreenBtn.innerHTML = `<i data-lucide="${isFs ? 'minimize' : 'maximize'}" class="w-4 h-4 sm:w-5 sm:h-5"></i>`;
                lucide.createIcons();
            });

            async function togglePiP() {
                try {
                    if (document.pictureInPictureElement) {
                        await document.exitPictureInPicture();
                    } else if (document.pictureInPictureEnabled) {
                        await video.requestPictureInPicture();
                    } else {
                        showActionBadge('PiP Unsupported');
                    }
                } catch (err) {
                    showActionBadge('PiP Unavailable');
                }
            }

            /**
             * Gesture Zone Handlers:
             * - Single click/tap anywhere toggles Play/Pause (with center pulse) & reveals controls
             * - Double-click/double-tap on Left edge skips -10s with ripple
             * - Double-click/double-tap on Right edge skips +10s with ripple
             * - Double-click on Center toggles Fullscreen
             */
            function handleZoneInteraction(zone) {
                const now = Date.now();
                const timeSinceLastTap = now - lastTapTime;

                if (timeSinceLastTap < 280 && timeSinceLastTap > 0) {
                    // Double Tap / Double Click detected
                    clearTimeout(singleTapTimer);
                    lastTapTime = 0;

                    if (zone === 'left') {
                        seekBy(-10, false);
                        triggerSkipRipple('left');
                        showControls();
                    } else if (zone === 'right') {
                        seekBy(10, false);
                        triggerSkipRipple('right');
                        showControls();
                    } else if (zone === 'center') {
                        toggleFullscreen();
                    }
                } else {
                    // Potential Single Tap / Click
                    lastTapTime = now;
                    clearTimeout(singleTapTimer);
                    singleTapTimer = setTimeout(() => {
                        togglePlay(true);
                        showControls();
                    }, 220);
                }
            }

            leftZone.addEventListener('click', () => handleZoneInteraction('left'));
            centerZone.addEventListener('click', (e) => {
                if (e.target.closest('#centerPlayBtn')) {
                    togglePlay(false);
                    return;
                }
                handleZoneInteraction('center');
            });
            rightZone.addEventListener('click', () => handleZoneInteraction('right'));

            // Video Element Events
            video.addEventListener('play', updatePlayPauseUI);
            video.addEventListener('pause', updatePlayPauseUI);
            video.addEventListener('ended', updatePlayPauseUI);
            video.addEventListener('timeupdate', updateProgress);
            video.addEventListener('progress', updateBuffer);

            video.addEventListener('loadedmetadata', () => {
                durationDisplay.textContent = formatTime(video.duration);
                loadingSpinner.classList.add('opacity-0');
                errorOverlay.classList.add('hidden');
                updateBuffer();
            });

            video.addEventListener('waiting', () => {
                loadingSpinner.classList.remove('opacity-0');
            });

            video.addEventListener('canplay', () => {
                loadingSpinner.classList.add('opacity-0');
                errorOverlay.classList.add('hidden');
            });

            video.addEventListener('error', () => {
                loadingSpinner.classList.add('opacity-0');
                errorOverlay.classList.remove('hidden');
                updatePlayPauseUI();
            });

            retryBtn.addEventListener('click', () => {
                errorOverlay.classList.add('hidden');
                loadingSpinner.classList.remove('opacity-0');
                const currentSrc = video.src;
                video.src = '';
                video.src = currentSrc;
                video.load();
                video.play().catch(() => {
                    loadingSpinner.classList.add('opacity-0');
                });
            });

            // Control Bar Buttons
            playPauseBtn.addEventListener('click', () => togglePlay(false));
            rewindBtn.addEventListener('click', () => seekBy(-10));
            forwardBtn.addEventListener('click', () => seekBy(10));
            muteBtn.addEventListener('click', toggleMute);
            volumeSlider.addEventListener('input', (e) => setVolume(parseFloat(e.target.value)));
            pipBtn.addEventListener('click', togglePiP);
            fullscreenBtn.addEventListener('click', toggleFullscreen);

            // Playback Speed Menu
            speedBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                speedMenu.classList.toggle('hidden');
                speedMenu.classList.toggle('flex');
            });

            speedOptions.forEach(option => {
                option.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const speed = parseFloat(option.dataset.speed);
                    video.playbackRate = speed;
                    speedBtn.textContent = `${speed}x`;

                    speedOptions.forEach(opt => {
                        opt.classList.remove('bg-indigo-600/35', 'text-indigo-300', 'font-semibold');
                        opt.classList.add('text-slate-300');
                    });
                    option.classList.add('bg-indigo-600/35', 'text-indigo-300', 'font-semibold');
                    option.classList.remove('text-slate-300');

                    speedMenu.classList.add('hidden');
                    speedMenu.classList.remove('flex');
                    showActionBadge(`Speed ${speed}x`);
                });
            });

            document.addEventListener('click', () => {
                if (!speedMenu.classList.contains('hidden')) {
                    speedMenu.classList.add('hidden');
                    speedMenu.classList.remove('flex');
                }
            });

            // Timeline Scrubber (Mouse + Touch)
            progressContainer.addEventListener('mousemove', (e) => {
                const rect = progressContainer.getBoundingClientRect();
                const pos = Math.min(Math.max(0, e.clientX - rect.left), rect.width);
                const ratio = pos / rect.width;

                hoverTooltip.style.left = `${pos}px`;
                hoverTooltip.textContent = formatTime(ratio * (video.duration || 0));
                hoverTooltip.classList.remove('opacity-0');

                if (isDraggingProgress) {
                    scrubToEvent(e.clientX);
                }
            });

            progressContainer.addEventListener('mouseleave', () => {
                if (!isDraggingProgress) {
                    hoverTooltip.classList.add('opacity-0');
                }
            });

            progressContainer.addEventListener('mousedown', (e) => {
                isDraggingProgress = true;
                const targetTime = scrubToEvent(e.clientX);
                if (video.duration) video.currentTime = targetTime;
            });

            window.addEventListener('mousemove', (e) => {
                if (isDraggingProgress) {
                    const targetTime = scrubToEvent(e.clientX);
                    if (video.duration) video.currentTime = targetTime;
                }
            });

            window.addEventListener('mouseup', () => {
                if (isDraggingProgress) {
                    isDraggingProgress = false;
                    hoverTooltip.classList.add('opacity-0');
                    scheduleHideControls();
                }
            });

            progressContainer.addEventListener('touchstart', (e) => {
                isDraggingProgress = true;
                const touch = e.touches[0];
                const targetTime = scrubToEvent(touch.clientX);
                if (video.duration) video.currentTime = targetTime;
            }, { passive: true });

            progressContainer.addEventListener('touchmove', (e) => {
                if (!isDraggingProgress) return;
                const touch = e.touches[0];
                const targetTime = scrubToEvent(touch.clientX);
                if (video.duration) video.currentTime = targetTime;
            }, { passive: true });

            progressContainer.addEventListener('touchend', () => {
                isDraggingProgress = false;
                scheduleHideControls();
            });

            // Auto-hide Controls on Mouse / Touch Activity
            playerContainer.addEventListener('mousemove', showControls);
            playerContainer.addEventListener('touchstart', showControls, { passive: true });
            playerContainer.addEventListener('mouseleave', () => {
                if (!video.paused && !isDraggingProgress) {
                    controlsOverlay.classList.add('opacity-0', 'translate-y-2', 'pointer-events-none');
                }
            });

            // Keyboard Shortcuts (Space, K, Arrows, M, F)
            document.addEventListener('keydown', (e) => {
                switch (e.code) {
                    case 'Space':
                    case 'KeyK':
                        e.preventDefault();
                        togglePlay(true);
                        showControls();
                        break;
                    case 'ArrowLeft':
                        e.preventDefault();
                        seekBy(-5);
                        showControls();
                        break;
                    case 'ArrowRight':
                        e.preventDefault();
                        seekBy(5);
                        showControls();
                        break;
                    case 'ArrowUp':
                        e.preventDefault();
                        setVolume(video.volume + 0.05);
                        showControls();
                        break;
                    case 'ArrowDown':
                        e.preventDefault();
                        setVolume(video.volume - 0.05);
                        showControls();
                        break;
                    case 'KeyM':
                        e.preventDefault();
                        toggleMute();
                        showControls();
                        break;
                    case 'KeyF':
                        e.preventDefault();
                        toggleFullscreen();
                        break;
                }
            });
        });
    </script>
</body>
</html>
