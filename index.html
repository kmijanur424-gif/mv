<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AetherPlayer — Modern Glassmorphism Video Player</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        glass: 'rgba(17, 24, 39, 0.72)',
                        glassBorder: 'rgba(255, 255, 255, 0.1)',
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col items-center justify-center p-3 sm:p-6 md:p-8 selection:bg-indigo-500 selection:text-white overflow-x-hidden relative">

    <!-- Ambient Background Glow Effects -->
    <div class="fixed inset-0 overflow-hidden pointer-events-none z-0">
        <div class="absolute -top-32 -left-32 w-96 h-96 bg-indigo-600/20 rounded-full blur-[128px]"></div>
        <div class="absolute -bottom-32 -right-32 w-96 h-96 bg-purple-600/20 rounded-full blur-[128px]"></div>
    </div>

    <!-- Main Container -->
    <main id="appContainer" class="w-full max-w-5xl z-10 flex flex-col gap-4 sm:gap-6 transition-all duration-500 ease-out">
        
        <!-- Top Bar: URL Loader & Title -->
        <header id="topBar" class="w-full bg-slate-900/60 backdrop-blur-xl border border-white/10 rounded-2xl p-3 sm:p-4 shadow-2xl flex flex-col md:flex-row items-stretch md:items-center justify-between gap-3 transition-all duration-300">
            <div class="flex items-center gap-3 px-1">
                <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-indigo-500 to-purple-500 flex items-center justify-center shadow-lg shadow-indigo-500/25 shrink-0">
                    <i data-lucide="play" class="w-4 h-4 text-white fill-white ml-0.5"></i>
                </div>
                <div class="min-w-0">
                    <h1 class="text-sm sm:text-base font-semibold tracking-tight text-white truncate">AetherStream Player</h1>
                    <p id="videoTitleDisplay" class="text-xs text-slate-400 truncate max-w-[240px] sm:max-w-xs">Sex Game 6969.mp4</p>
                </div>
            </div>

            <!-- Custom Video URL Input Form -->
            <form id="urlForm" class="flex-1 max-w-xl flex items-center gap-2">
                <div class="relative flex-1">
                    <i data-lucide="link" class="w-4 h-4 text-slate-400 absolute left-3.5 top-1/2 -translate-y-1/2 pointer-events-none"></i>
                    <input 
                        type="url" 
                        id="videoUrlInput" 
                        placeholder="Paste custom MP4 or direct video URL..." 
                        value="https://cdn.freevidco.com/Sex%20Game%206969.mp4"
                        required
                        class="w-full bg-slate-950/70 border border-white/10 focus:border-indigo-500/70 focus:ring-2 focus:ring-indigo-500/20 rounded-xl pl-10 pr-3 py-2 text-xs sm:text-sm text-slate-200 placeholder-slate-500 outline-none transition-all"
                    >
                </div>
                <button 
                    type="submit" 
                    class="bg-indigo-600 hover:bg-indigo-500 active:scale-95 text-white text-xs sm:text-sm font-medium px-4 py-2 rounded-xl shadow-lg shadow-indigo-600/25 transition-all flex items-center gap-1.5 shrink-0 cursor-pointer"
                >
                    <i data-lucide="arrow-right-circle" class="w-4 h-4"></i>
                    <span>Load</span>
                </button>
            </form>
        </header>

        <!-- Notification / Toast Banner (Replaces alert()) -->
        <div id="toastBanner" class="hidden w-full bg-rose-500/15 border border-rose-500/30 backdrop-blur-md text-rose-200 px-4 py-3 rounded-2xl text-xs sm:text-sm flex items-center justify-between gap-3 transition-all">
            <div class="flex items-center gap-2.5">
                <i data-lucide="alert-circle" class="w-4 h-4 text-rose-400 shrink-0"></i>
                <span id="toastMessage">Unable to load video stream. Check URL or CORS settings.</span>
            </div>
            <button id="closeToastBtn" class="text-rose-300 hover:text-white p-1 rounded-lg transition-colors cursor-pointer">
                <i data-lucide="x" class="w-4 h-4"></i>
            </button>
        </div>

        <!-- Video Player Wrapper -->
        <div 
            id="playerContainer" 
            tabindex="0"
            class="relative w-full aspect-video bg-black rounded-2xl sm:rounded-3xl overflow-hidden shadow-[0_25px_70px_-15px_rgba(0,0,0,0.85)] border border-white/10 group select-none outline-none focus:ring-2 focus:ring-indigo-500/40 transition-all duration-300"
        >
            <!-- HTML5 Video Element -->
            <video 
                id="videoElement" 
                class="w-full h-full object-contain bg-black cursor-pointer"
                src="https://cdn.freevidco.com/Sex%20Game%206969.mp4"
                playsinline
                preload="metadata"
            ></video>

            <!-- Loading Spinner Overlay -->
            <div id="loadingSpinner" class="absolute inset-0 flex items-center justify-center bg-black/40 backdrop-blur-[2px] pointer-events-none opacity-0 transition-opacity duration-200 z-20">
                <div class="w-12 h-12 rounded-full border-4 border-white/15 border-t-indigo-500 animate-spin"></div>
            </div>

            <!-- Action Feedback Badge (e.g., +5s, -5s, Volume %, Play/Pause) -->
            <div id="actionBadge" class="absolute top-6 right-6 bg-slate-900/80 backdrop-blur-md border border-white/15 text-white px-3.5 py-1.5 rounded-full text-xs sm:text-sm font-medium flex items-center gap-2 opacity-0 scale-95 pointer-events-none transition-all duration-200 z-20 shadow-xl">
                <span id="actionBadgeText">100%</span>
            </div>

            <!-- Clickable Center Play/Pause Overlay Button -->
            <div id="centerOverlay" class="absolute inset-0 flex items-center justify-center bg-black/25 transition-opacity duration-300 z-10 cursor-pointer">
                <button 
                    id="centerPlayBtn" 
                    aria-label="Play or Pause Video"
                    class="w-16 h-16 sm:w-20 sm:h-20 rounded-full bg-slate-900/65 hover:bg-indigo-600/90 backdrop-blur-xl border border-white/20 flex items-center justify-center text-white shadow-[0_0_40px_rgba(99,102,241,0.4)] hover:scale-105 active:scale-95 transition-all duration-200 cursor-pointer"
                >
                    <i id="centerPlayIcon" data-lucide="play" class="w-7 h-7 sm:w-8 sm:h-8 fill-white ml-1"></i>
                </button>
            </div>

            <!-- Bottom Glassmorphism Control Bar -->
            <div 
                id="controlsOverlay" 
                class="absolute inset-x-0 bottom-0 pt-16 pb-3 px-3 sm:px-5 sm:pb-4 bg-gradient-to-t from-black/90 via-black/50 to-transparent transition-all duration-300 z-30 flex flex-col gap-2.5"
            >
                <!-- Interactive Seek / Progress Bar -->
                <div id="progressContainer" class="relative w-full h-5 flex items-center cursor-pointer group/progress touch-none">
                    <!-- Hover Time Tooltip -->
                    <div 
                        id="hoverTooltip" 
                        class="absolute -top-8 -translate-x-1/2 bg-slate-900/90 backdrop-blur-md border border-white/15 text-white text-[11px] font-medium px-2 py-0.5 rounded-md pointer-events-none opacity-0 transition-opacity duration-150 shadow-lg whitespace-nowrap"
                    >
                        00:00
                    </div>

                    <!-- Track Background -->
                    <div class="relative w-full h-1.5 group-hover/progress:h-2.5 bg-white/20 rounded-full overflow-hidden transition-all duration-150">
                        <!-- Buffered Bar -->
                        <div id="bufferedBar" class="absolute top-0 left-0 h-full bg-white/30 rounded-full w-0 transition-all duration-200"></div>
                        <!-- Played Progress Bar -->
                        <div id="progressBar" class="absolute top-0 left-0 h-full bg-gradient-to-r from-indigo-500 via-purple-500 to-pink-500 rounded-full w-0"></div>
                    </div>

                    <!-- Scrubber Thumb -->
                    <div 
                        id="progressThumb" 
                        class="absolute left-0 -translate-x-1/2 w-3.5 h-3.5 sm:w-4 sm:h-4 bg-white rounded-full shadow-[0_0_12px_rgba(255,255,255,0.9)] scale-0 group-hover/progress:scale-100 transition-transform duration-150 pointer-events-none"
                    ></div>
                </div>

                <!-- Control Buttons Row -->
                <div class="w-full bg-slate-900/65 backdrop-blur-xl border border-white/10 rounded-2xl px-2.5 py-1.5 sm:px-4 sm:py-2 flex items-center justify-between gap-2 shadow-2xl">
                    
                    <!-- Left Controls: Play/Pause, Skip, Volume, Time -->
                    <div class="flex items-center gap-1 sm:gap-2.5">
                        <!-- Play/Pause Button -->
                        <button id="playPauseBtn" title="Play/Pause (Space)" class="p-2 rounded-xl text-slate-200 hover:text-white hover:bg-white/10 transition-colors cursor-pointer">
                            <i id="playPauseIcon" data-lucide="play" class="w-5 h-5 fill-current"></i>
                        </button>

                        <!-- Rewind 5s -->
                        <button id="rewindBtn" title="Rewind 5s (Left Arrow)" class="hidden sm:flex p-2 rounded-xl text-slate-300 hover:text-white hover:bg-white/10 transition-colors cursor-pointer">
                            <i data-lucide="rotate-ccw" class="w-4 h-4"></i>
                        </button>

                        <!-- Forward 5s -->
                        <button id="forwardBtn" title="Forward 5s (Right Arrow)" class="hidden sm:flex p-2 rounded-xl text-slate-300 hover:text-white hover:bg-white/10 transition-colors cursor-pointer">
                            <i data-lucide="rotate-cw" class="w-4 h-4"></i>
                        </button>

                        <!-- Volume Controls -->
                        <div class="flex items-center gap-1.5 group/vol">
                            <button id="muteBtn" title="Mute/Unmute (M)" class="p-2 rounded-xl text-slate-200 hover:text-white hover:bg-white/10 transition-colors cursor-pointer">
                                <i id="volumeIcon" data-lucide="volume-2" class="w-5 h-5"></i>
                            </button>
                            <div class="w-0 overflow-hidden group-hover/vol:w-16 sm:w-20 transition-all duration-200 flex items-center">
                                <input 
                                    type="range" 
                                    id="volumeSlider" 
                                    min="0" 
                                    max="1" 
                                    step="0.02" 
                                    value="1" 
                                    aria-label="Volume"
                                    class="w-full h-1.5 bg-white/25 rounded-lg appearance-none cursor-pointer accent-indigo-500"
                                >
                            </div>
                        </div>

                        <!-- Current Time / Total Duration -->
                        <div class="text-xs sm:text-sm font-medium text-slate-300 tabular-nums pl-1 select-none">
                            <span id="currentTimeDisplay" class="text-white">00:00</span>
                            <span class="text-slate-500 mx-1">/</span>
                            <span id="durationDisplay">00:00</span>
                        </div>
                    </div>

                    <!-- Right Controls: Playback Speed, PiP, Theater, Fullscreen -->
                    <div class="flex items-center gap-1 sm:gap-2">
                        <!-- Playback Speed Selector -->
                        <div class="relative">
                            <button 
                                id="speedBtn" 
                                title="Playback Speed"
                                class="px-2.5 py-1.5 rounded-xl text-xs font-semibold text-slate-200 hover:text-white bg-white/5 hover:bg-white/15 border border-white/10 transition-all cursor-pointer tabular-nums"
                            >
                                1x
                            </button>
                            <!-- Speed Dropdown Menu -->
                            <div 
                                id="speedMenu" 
                                class="hidden absolute bottom-full right-0 mb-2 w-24 bg-slate-900/95 backdrop-blur-xl border border-white/15 rounded-xl p-1 shadow-2xl flex-col gap-0.5 z-40"
                            >
                                <button data-speed="0.5" class="speed-option w-full text-left px-3 py-1.5 text-xs rounded-lg text-slate-300 hover:bg-white/10 hover:text-white transition-colors cursor-pointer">0.5x</button>
                                <button data-speed="1" class="speed-option w-full text-left px-3 py-1.5 text-xs rounded-lg bg-indigo-600/30 text-indigo-300 font-semibold transition-colors cursor-pointer">1x</button>
                                <button data-speed="1.25" class="speed-option w-full text-left px-3 py-1.5 text-xs rounded-lg text-slate-300 hover:bg-white/10 hover:text-white transition-colors cursor-pointer">1.25x</button>
                                <button data-speed="1.5" class="speed-option w-full text-left px-3 py-1.5 text-xs rounded-lg text-slate-300 hover:bg-white/10 hover:text-white transition-colors cursor-pointer">1.5x</button>
                                <button data-speed="2" class="speed-option w-full text-left px-3 py-1.5 text-xs rounded-lg text-slate-300 hover:bg-white/10 hover:text-white transition-colors cursor-pointer">2x</button>
                            </div>
                        </div>

                        <!-- Picture-in-Picture Toggle -->
                        <button id="pipBtn" title="Picture-in-Picture" class="p-2 rounded-xl text-slate-200 hover:text-white hover:bg-white/10 transition-colors cursor-pointer">
                            <i data-lucide="picture-in-picture-2" class="w-4 h-4 sm:w-5 sm:h-5"></i>
                        </button>

                        <!-- Theater Mode Toggle -->
                        <button id="theaterBtn" title="Theater Mode (T)" class="hidden md:flex p-2 rounded-xl text-slate-200 hover:text-white hover:bg-white/10 transition-colors cursor-pointer">
                            <i id="theaterIcon" data-lucide="rectangle-horizontal" class="w-4 h-4 sm:w-5 sm:h-5"></i>
                        </button>

                        <!-- Fullscreen Toggle -->
                        <button id="fullscreenBtn" title="Fullscreen (F)" class="p-2 rounded-xl text-slate-200 hover:text-white hover:bg-white/10 transition-colors cursor-pointer">
                            <i id="fullscreenIcon" data-lucide="maximize" class="w-4 h-4 sm:w-5 sm:h-5"></i>
                        </button>
                    </div>

                </div>
            </div>
        </div>

        <!-- Keyboard Shortcuts Legend -->
        <footer id="shortcutsFooter" class="w-full flex flex-wrap items-center justify-center gap-x-5 gap-y-2 text-[11px] sm:text-xs text-slate-400 px-2">
            <span class="flex items-center gap-1.5"><kbd class="px-1.5 py-0.5 bg-slate-800/80 border border-white/10 rounded text-slate-300 font-mono">Space</kbd> Play/Pause</span>
            <span class="flex items-center gap-1.5"><kbd class="px-1.5 py-0.5 bg-slate-800/80 border border-white/10 rounded text-slate-300 font-mono">← / →</kbd> Seek ±5s</span>
            <span class="flex items-center gap-1.5"><kbd class="px-1.5 py-0.5 bg-slate-800/80 border border-white/10 rounded text-slate-300 font-mono">↑ / ↓</kbd> Volume</span>
            <span class="flex items-center gap-1.5"><kbd class="px-1.5 py-0.5 bg-slate-800/80 border border-white/10 rounded text-slate-300 font-mono">M</kbd> Mute</span>
            <span class="flex items-center gap-1.5"><kbd class="px-1.5 py-0.5 bg-slate-800/80 border border-white/10 rounded text-slate-300 font-mono">F</kbd> Fullscreen</span>
        </footer>

    </main>

    <script>
        /**
         * AetherStream Glassmorphism Video Player Logic
         * Handles playback, seeking, touch/mouse scrubbing, volume, speeds, PiP, Theater, Fullscreen, and shortcuts.
         */
        document.addEventListener('DOMContentLoaded', () => {
            // Initialize Lucide icons
            lucide.createIcons();

            // DOM Elements
            const appContainer = document.getElementById('appContainer');
            const playerContainer = document.getElementById('playerContainer');
            const video = document.getElementById('videoElement');
            const urlForm = document.getElementById('urlForm');
            const videoUrlInput = document.getElementById('videoUrlInput');
            const videoTitleDisplay = document.getElementById('videoTitleDisplay');

            // Toast Notification Elements
            const toastBanner = document.getElementById('toastBanner');
            const toastMessage = document.getElementById('toastMessage');
            const closeToastBtn = document.getElementById('closeToastBtn');

            // Overlays & Feedback
            const loadingSpinner = document.getElementById('loadingSpinner');
            const centerOverlay = document.getElementById('centerOverlay');
            const centerPlayBtn = document.getElementById('centerPlayBtn');
            const controlsOverlay = document.getElementById('controlsOverlay');
            const actionBadge = document.getElementById('actionBadge');
            const actionBadgeText = document.getElementById('actionBadgeText');

            // Progress Bar Elements
            const progressContainer = document.getElementById('progressContainer');
            const bufferedBar = document.getElementById('bufferedBar');
            const progressBar = document.getElementById('progressBar');
            const progressThumb = document.getElementById('progressThumb');
            const hoverTooltip = document.getElementById('hoverTooltip');

            // Control Buttons & Displays
            const playPauseBtn = document.getElementById('playPauseBtn');
            const rewindBtn = document.getElementById('rewindBtn');
            const forwardBtn = document.getElementById('forwardBtn');
            const muteBtn = document.getElementById('muteBtn');
            const volumeSlider = document.getElementById('volumeSlider');
            const currentTimeDisplay = document.getElementById('currentTimeDisplay');
            const durationDisplay = document.getElementById('durationDisplay');

            // Speed, PiP, Theater, Fullscreen
            const speedBtn = document.getElementById('speedBtn');
            const speedMenu = document.getElementById('speedMenu');
            const speedOptions = document.querySelectorAll('.speed-option');
            const pipBtn = document.getElementById('pipBtn');
            const theaterBtn = document.getElementById('theaterBtn');
            const fullscreenBtn = document.getElementById('fullscreenBtn');

            // State Variables
            let isDraggingProgress = false;
            let hideControlsTimeout = null;
            let badgeTimeout = null;
            let isTheaterMode = false;
            let lastVolume = 1;

            /**
             * Formats seconds into HH:MM:SS or MM:SS
             */
            function formatTime(seconds) {
                if (isNaN(seconds) || !isFinite(seconds) || seconds < 0) return '00:00';
                const hrs = Math.floor(seconds / 3600);
                const mins = Math.floor((seconds % 3600) / 60);
                const secs = Math.floor(seconds % 60);
                if (hrs > 0) {
                    return `${hrs}:${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
                }
                return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
            }

            /**
             * Displays a temporary floating badge inside the player for visual feedback
             */
            function showActionBadge(text) {
                actionBadgeText.textContent = text;
                actionBadge.classList.remove('opacity-0', 'scale-95');
                actionBadge.classList.add('opacity-100', 'scale-100');
                clearTimeout(badgeTimeout);
                badgeTimeout = setTimeout(() => {
                    actionBadge.classList.remove('opacity-100', 'scale-100');
                    actionBadge.classList.add('opacity-0', 'scale-95');
                }, 900);
            }

            /**
             * Shows non-blocking toast notification for errors/notices
             */
            function showToast(msg) {
                toastMessage.textContent = msg;
                toastBanner.classList.remove('hidden');
            }

            closeToastBtn.addEventListener('click', () => {
                toastBanner.classList.add('hidden');
            });

            /**
             * Updates Play/Pause icons across center overlay and bottom bar
             */
            function updatePlayPauseUI() {
                const isPaused = video.paused || video.ended;
                const iconName = isPaused ? 'play' : 'pause';

                // Update bottom button icon
                playPauseBtn.innerHTML = `<i data-lucide="${iconName}" class="w-5 h-5 fill-current"></i>`;
                // Update center button icon
                centerPlayBtn.innerHTML = `<i data-lucide="${iconName}" class="w-7 h-7 sm:w-8 sm:h-8 fill-white ${isPaused ? 'ml-1' : ''}"></i>`;
                lucide.createIcons();

                if (isPaused) {
                    centerOverlay.classList.remove('opacity-0', 'pointer-events-none');
                    showControls();
                } else {
                    centerOverlay.classList.add('opacity-0', 'pointer-events-none');
                    scheduleHideControls();
                }
            }

            /**
             * Toggles Play / Pause state safely
             */
            async function togglePlay() {
                try {
                    if (video.paused || video.ended) {
                        await video.play();
                    } else {
                        video.pause();
                    }
                } catch (err) {
                    console.error('Playback error:', err);
                    showToast('Playback interrupted or blocked by browser. Click Play to retry.');
                }
            }

            /**
             * Seeks relative to current time
             */
            function seekBy(seconds) {
                if (!video.duration) return;
                video.currentTime = Math.min(Math.max(0, video.currentTime + seconds), video.duration);
                showActionBadge(seconds > 0 ? `+${seconds}s` : `${seconds}s`);
            }

            /**
             * Updates Volume Icon based on mute state & level
             */
            function updateVolumeUI() {
                const vol = video.muted ? 0 : video.volume;
                volumeSlider.value = vol;
                let iconName = 'volume-2';
                if (vol === 0) iconName = 'volume-x';
                else if (vol < 0.5) iconName = 'volume-1';

                muteBtn.innerHTML = `<i data-lucide="${iconName}" class="w-5 h-5"></i>`;
                lucide.createIcons();
            }

            /**
             * Sets volume safely and updates UI
             */
            function setVolume(newVol) {
                const clamped = Math.min(Math.max(0, newVol), 1);
                video.volume = clamped;
                video.muted = clamped === 0;
                if (clamped > 0) lastVolume = clamped;
                updateVolumeUI();
                showActionBadge(`Volume ${Math.round(clamped * 100)}%`);
            }

            /**
             * Toggles Mute
             */
            function toggleMute() {
                if (video.muted || video.volume === 0) {
                    video.muted = false;
                    video.volume = lastVolume > 0 ? lastVolume : 0.5;
                } else {
                    lastVolume = video.volume;
                    video.muted = true;
                }
                updateVolumeUI();
                showActionBadge(video.muted ? 'Muted' : `Volume ${Math.round(video.volume * 100)}%`);
            }

            /**
             * Updates Progress Bar & Time Displays
             */
            function updateProgress() {
                if (!video.duration || isDraggingProgress) return;
                const percent = (video.currentTime / video.duration) * 100;
                progressBar.style.width = `${percent}%`;
                progressThumb.style.left = `${percent}%`;
                currentTimeDisplay.textContent = formatTime(video.currentTime);
            }

            /**
             * Updates Buffered Bar
             */
            function updateBuffer() {
                if (!video.duration || video.buffered.length === 0) return;
                try {
                    const bufferedEnd = video.buffered.end(video.buffered.length - 1);
                    const percent = Math.min((bufferedEnd / video.duration) * 100, 100);
                    bufferedBar.style.width = `${percent}%`;
                } catch (e) {
                    // Ignore range errors when source changes
                }
            }

            /**
             * Handles scrubbing/seeking along the progress bar
             */
            function scrubToEvent(clientX) {
                const rect = progressContainer.getBoundingClientRect();
                const pos = Math.min(Math.max(0, clientX - rect.left), rect.width);
                const ratio = pos / rect.width;
                const percent = ratio * 100;

                progressBar.style.width = `${percent}%`;
                progressThumb.style.left = `${percent}%`;

                if (video.duration) {
                    const targetTime = ratio * video.duration;
                    currentTimeDisplay.textContent = formatTime(targetTime);
                    return targetTime;
                }
                return 0;
            }

            /**
             * Auto-hide controls on mouse inactivity during playback
             */
            function showControls() {
                controlsOverlay.classList.remove('opacity-0', 'translate-y-2', 'pointer-events-none');
                playerContainer.classList.remove('cursor-none');
                scheduleHideControls();
            }

            function scheduleHideControls() {
                clearTimeout(hideControlsTimeout);
                if (!video.paused && !video.ended && !isDraggingProgress && speedMenu.classList.contains('hidden')) {
                    hideControlsTimeout = setTimeout(() => {
                        controlsOverlay.classList.add('opacity-0', 'translate-y-2', 'pointer-events-none');
                        playerContainer.classList.add('cursor-none');
                    }, 2600);
                }
            }

            /**
             * Fullscreen Toggle
             */
            async function toggleFullscreen() {
                try {
                    if (!document.fullscreenElement) {
                        await playerContainer.requestFullscreen();
                    } else {
                        await document.exitFullscreen();
                    }
                } catch (err) {
                    showToast('Fullscreen mode is not supported or blocked in this view.');
                }
            }

            document.addEventListener('fullscreenchange', () => {
                const isFs = !!document.fullscreenElement;
                fullscreenBtn.innerHTML = `<i data-lucide="${isFs ? 'minimize' : 'maximize'}" class="w-4 h-4 sm:w-5 sm:h-5"></i>`;
                lucide.createIcons();
                if (isFs) {
                    playerContainer.classList.remove('rounded-2xl', 'sm:rounded-3xl');
                } else {
                    playerContainer.classList.add('rounded-2xl', 'sm:rounded-3xl');
                }
            });

            /**
             * Theater Mode Toggle
             */
            function toggleTheaterMode() {
                isTheaterMode = !isTheaterMode;
                if (isTheaterMode) {
                    appContainer.classList.remove('max-w-5xl');
                    appContainer.classList.add('max-w-full');
                    playerContainer.classList.add('max-h-[82vh]');
                    showActionBadge('Theater Mode');
                } else {
                    appContainer.classList.add('max-w-5xl');
                    appContainer.classList.remove('max-w-full');
                    playerContainer.classList.remove('max-h-[82vh]');
                    showActionBadge('Default View');
                }
            }

            /**
             * Picture-in-Picture Toggle
             */
            async function togglePiP() {
                try {
                    if (document.pictureInPictureElement) {
                        await document.exitPictureInPicture();
                    } else if (document.pictureInPictureEnabled) {
                        await video.requestPictureInPicture();
                    } else {
                        showToast('Picture-in-Picture is not supported by your browser.');
                    }
                } catch (err) {
                    showToast('Unable to enter Picture-in-Picture mode.');
                }
            }

            /**
             * Load Custom Video URL
             */
            urlForm.addEventListener('submit', (e) => {
                e.preventDefault();
                const rawUrl = videoUrlInput.value.trim();
                if (!rawUrl) return;

                toastBanner.classList.add('hidden');
                loadingSpinner.classList.remove('opacity-0');

                // Extract filename for display title
                try {
                    const urlObj = new URL(rawUrl);
                    const pathname = decodeURIComponent(urlObj.pathname);
                    const fileName = pathname.split('/').filter(Boolean).pop() || urlObj.hostname;
                    videoTitleDisplay.textContent = fileName;
                } catch {
                    videoTitleDisplay.textContent = 'Custom Video Stream';
                }

                // Reset progress UI
                progressBar.style.width = '0%';
                bufferedBar.style.width = '0%';
                progressThumb.style.left = '0%';
                currentTimeDisplay.textContent = '00:00';
                durationDisplay.textContent = '00:00';

                video.src = rawUrl;
                video.load();
                video.play().catch(() => {
                    // Autoplay might be blocked; user can click play manually
                    updatePlayPauseUI();
                });
            });

            // Video Element Event Listeners
            video.addEventListener('play', updatePlayPauseUI);
            video.addEventListener('pause', updatePlayPauseUI);
            video.addEventListener('ended', updatePlayPauseUI);
            video.addEventListener('timeupdate', updateProgress);
            video.addEventListener('progress', updateBuffer);

            video.addEventListener('loadedmetadata', () => {
                durationDisplay.textContent = formatTime(video.duration);
                loadingSpinner.classList.add('opacity-0');
                updateBuffer();
            });

            video.addEventListener('waiting', () => {
                loadingSpinner.classList.remove('opacity-0');
            });

            video.addEventListener('canplay', () => {
                loadingSpinner.classList.add('opacity-0');
            });

            video.addEventListener('error', () => {
                loadingSpinner.classList.add('opacity-0');
                updatePlayPauseUI();
                showToast('Failed to load video. The link may be unreachable, expired, or restricted.');
            });

            // Click / Double-click on Video & Center Overlay
            video.addEventListener('click', togglePlay);
            centerOverlay.addEventListener('click', togglePlay);
            video.addEventListener('dblclick', toggleFullscreen);

            // Button Listeners
            playPauseBtn.addEventListener('click', togglePlay);
            rewindBtn.addEventListener('click', () => seekBy(-5));
            forwardBtn.addEventListener('click', () => seekBy(5));
            muteBtn.addEventListener('click', toggleMute);
            volumeSlider.addEventListener('input', (e) => setVolume(parseFloat(e.target.value)));
            pipBtn.addEventListener('click', togglePiP);
            theaterBtn.addEventListener('click', toggleTheaterMode);
            fullscreenBtn.addEventListener('click', toggleFullscreen);

            // Playback Speed Menu Logic
            speedBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                speedMenu.classList.toggle('hidden');
                speedMenu.classList.toggle('flex');
            });

            speedOptions.forEach(option => {
                option.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const speed = parseFloat(option.dataset.speed);
                    video.playbackRate = speed;
                    speedBtn.textContent = `${speed}x`;

                    speedOptions.forEach(opt => {
                        opt.classList.remove('bg-indigo-600/30', 'text-indigo-300', 'font-semibold');
                        opt.classList.add('text-slate-300');
                    });
                    option.classList.add('bg-indigo-600/30', 'text-indigo-300', 'font-semibold');
                    option.classList.remove('text-slate-300');

                    speedMenu.classList.add('hidden');
                    speedMenu.classList.remove('flex');
                    showActionBadge(`Speed ${speed}x`);
                });
            });

            document.addEventListener('click', () => {
                if (!speedMenu.classList.contains('hidden')) {
                    speedMenu.classList.add('hidden');
                    speedMenu.classList.remove('flex');
                }
            });

            // Progress Bar Hover Tooltip & Scrubbing (Mouse + Touch)
            progressContainer.addEventListener('mousemove', (e) => {
                const rect = progressContainer.getBoundingClientRect();
                const pos = Math.min(Math.max(0, e.clientX - rect.left), rect.width);
                const ratio = pos / rect.width;

                hoverTooltip.style.left = `${pos}px`;
                hoverTooltip.textContent = formatTime(ratio * (video.duration || 0));
                hoverTooltip.classList.remove('opacity-0');

                if (isDraggingProgress) {
                    scrubToEvent(e.clientX);
                }
            });

            progressContainer.addEventListener('mouseleave', () => {
                if (!isDraggingProgress) {
                    hoverTooltip.classList.add('opacity-0');
                }
            });

            progressContainer.addEventListener('mousedown', (e) => {
                isDraggingProgress = true;
                const targetTime = scrubToEvent(e.clientX);
                if (video.duration) video.currentTime = targetTime;
            });

            window.addEventListener('mousemove', (e) => {
                if (isDraggingProgress) {
                    const targetTime = scrubToEvent(e.clientX);
                    if (video.duration) video.currentTime = targetTime;
                }
            });

            window.addEventListener('mouseup', () => {
                if (isDraggingProgress) {
                    isDraggingProgress = false;
                    hoverTooltip.classList.add('opacity-0');
                    scheduleHideControls();
                }
            });

            // Touch Support for Progress Bar
            progressContainer.addEventListener('touchstart', (e) => {
                isDraggingProgress = true;
                const touch = e.touches[0];
                const targetTime = scrubToEvent(touch.clientX);
                if (video.duration) video.currentTime = targetTime;
            }, { passive: true });

            progressContainer.addEventListener('touchmove', (e) => {
                if (!isDraggingProgress) return;
                const touch = e.touches[0];
                const targetTime = scrubToEvent(touch.clientX);
                if (video.duration) video.currentTime = targetTime;
            }, { passive: true });

            progressContainer.addEventListener('touchend', () => {
                isDraggingProgress = false;
                scheduleHideControls();
            });

            // Mouse Activity Auto-Hide Triggers
            playerContainer.addEventListener('mousemove', showControls);
            playerContainer.addEventListener('touchstart', showControls, { passive: true });
            playerContainer.addEventListener('mouseleave', () => {
                if (!video.paused && !isDraggingProgress) {
                    controlsOverlay.classList.add('opacity-0', 'translate-y-2', 'pointer-events-none');
                }
            });

            // Global Keyboard Shortcuts (Ignore when typing in URL input)
            document.addEventListener('keydown', (e) => {
                if (document.activeElement === videoUrlInput) return;

                switch (e.code) {
                    case 'Space':
                        e.preventDefault();
                        togglePlay();
                        showControls();
                        break;
                    case 'ArrowLeft':
                        e.preventDefault();
                        seekBy(-5);
                        showControls();
                        break;
                    case 'ArrowRight':
                        e.preventDefault();
                        seekBy(5);
                        showControls();
                        break;
                    case 'ArrowUp':
                        e.preventDefault();
                        setVolume(video.volume + 0.05);
                        showControls();
                        break;
                    case 'ArrowDown':
                        e.preventDefault();
                        setVolume(video.volume - 0.05);
                        showControls();
                        break;
                    case 'KeyM':
                        e.preventDefault();
                        toggleMute();
                        showControls();
                        break;
                    case 'KeyF':
                        e.preventDefault();
                        toggleFullscreen();
                        break;
                    case 'KeyT':
                        e.preventDefault();
                        toggleTheaterMode();
                        break;
                }
            });
        });
    </script>
</body>
</html>
